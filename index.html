<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai StockSheet</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <!-- เปลี่ยนมาใช้ QuaggaJS (ไลบรารีที่ดีที่สุดสำหรับสแกน 1D Barcode) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0fdf4; }
        .ai-glow { animation: glow 1.5s infinite alternate; border-color: #22c55e !important; box-shadow: 0 0 10px #86efac; }
        @keyframes glow { from { box-shadow: 0 0 5px #22c55e; } to { box-shadow: 0 0 15px #86efac; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 2s linear infinite; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* QuaggaJS Camera Overlay Styles */
        #interactive.viewport {
            position: relative;
            width: 100%;
            height: 300px;
            overflow: hidden;
            background-color: black;
        }
        #interactive.viewport video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* ให้ภาพกล้องเต็มพื้นที่ */
        }
        #interactive.viewport canvas.drawingBuffer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 10;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // 🔒 โซนตั้งค่าข้อมูลลูกค้า
        // ==========================================
        const CUSTOMER_CONFIG = {
            shopName: "Ai StockSheet",
            clientName: "ลูกค้าทั่วไป",
            contact: "-",
            sheetUrl: "", 
            locked: false 
        };

        const { useState, useEffect, useRef, useMemo } = React;

        // --- Icons ---
        const IconCamera = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>;
        const IconSave = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
        const IconFileSpreadsheet = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>;
        const IconTrash2 = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        const IconEdit = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
        const IconCloud = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>;
        const IconCloudUpload = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
        const IconCloudDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
        const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const IconMinus = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const IconSettings = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 0 1-2.83 0 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
        const IconSparkles = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 3v4"/><path d="M3 5h4"/><path d="M3 9h4"/></svg>;
        const IconClose = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const IconList = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>;
        const IconSearch = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        const IconPackage = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16.5 9.4 7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>;
        const IconAlertCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
        const IconTag = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>;
        const IconCheckCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;

        // ==========================================
        // 📷 QuaggaJS Barcode Scanner Component
        // ==========================================
        const QuaggaScanner = ({ onScan, onClose, onAiFallback }) => {
            const fileInputRef = useRef(null);

            useEffect(() => {
                let isUnmounted = false;

                const startQuagga = () => {
                    if (isUnmounted) return;

                    Quagga.init({
                        inputStream: {
                            name: "Live",
                            type: "LiveStream",
                            target: document.querySelector('#interactive'),
                            constraints: {
                                facingMode: "environment", // ใช้กล้องหลัง
                                width: { ideal: 1280 },    // ขอความละเอียดสูงเพื่อให้บาร์โค้ดชัด
                                height: { ideal: 720 }
                            },
                        },
                        locator: {
                            patchSize: "medium",
                            halfSample: true
                        },
                        numOfWorkers: navigator.hardwareConcurrency ? navigator.hardwareConcurrency : 4,
                        decoder: {
                            readers: [
                                "ean_reader", 
                                "ean_8_reader", 
                                "code_128_reader", 
                                "code_39_reader", 
                                "upc_reader", 
                                "upc_e_reader"
                            ]
                        },
                        locate: true // เปิดระบบช่วยหาบาร์โค้ดในภาพ
                    }, function (err) {
                        if (err) {
                            console.error("Quagga Init Error:", err);
                            return;
                        }
                        if (!isUnmounted) {
                            Quagga.start();
                        }
                    });

                    // วาดกรอบสีเขียวล้อมรอบบาร์โค้ดเมื่อจับเจอ
                    Quagga.onProcessed(function(result) {
                        var drawingCtx = Quagga.canvas.ctx.overlay,
                            drawingCanvas = Quagga.canvas.dom.overlay;

                        if (result) {
                            if (result.boxes) {
                                drawingCtx.clearRect(0, 0, parseInt(drawingCanvas.getAttribute("width")), parseInt(drawingCanvas.getAttribute("height")));
                                result.boxes.filter(function (box) {
                                    return box !== result.box;
                                }).forEach(function (box) {
                                    Quagga.ImageDebug.drawPath(box, {x: 0, y: 1}, drawingCtx, {color: "green", lineWidth: 2});
                                });
                            }
                            if (result.box) {
                                Quagga.ImageDebug.drawPath(result.box, {x: 0, y: 1}, drawingCtx, {color: "#00F", lineWidth: 2});
                            }
                            if (result.codeResult && result.codeResult.code) {
                                Quagga.ImageDebug.drawPath(result.line, {x: 'x', y: 'y'}, drawingCtx, {color: 'red', lineWidth: 3});
                            }
                        }
                    });

                    // เมื่อสแกนได้ผลลัพธ์
                    Quagga.onDetected((data) => {
                        if (isUnmounted) return;
                        
                        const code = data.codeResult.code;
                        
                        // หยุด Quagga ทันทีเพื่อป้องกันการจับซ้ำรัวๆ
                        Quagga.stop();
                        onScan(code);
                    });
                };

                // ดีเลย์เล็กน้อยเพื่อให้ UI เรนเดอร์เสร็จ
                setTimeout(startQuagga, 200);

                return () => {
                    isUnmounted = true;
                    try {
                        Quagga.stop();
                    } catch (e) {}
                };
            }, [onScan]);

            // ถ่ายรูปแล้วส่งให้ AI (Fallback)
            const handleNativeScan = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onloadend = async () => {
                    const base64Data = reader.result;
                    // ปิดกล้องสดแล้วส่งให้ AI จัดการ
                    try { Quagga.stop(); } catch(err){}
                    onAiFallback(base64Data);
                };
                reader.readAsDataURL(file);
                e.target.value = "";
            };

            return (
                <div className="fixed inset-0 bg-black/90 z-[100] flex flex-col items-center justify-center p-4 backdrop-blur-sm">
                    <div className="w-full max-w-sm bg-white rounded-3xl overflow-hidden relative shadow-2xl border-4 border-emerald-500 flex flex-col">
                        <button onClick={onClose} className="absolute top-4 right-4 z-[110] bg-black/50 hover:bg-black/70 p-2 rounded-full text-white transition"><IconClose /></button>
                        
                        {/* Quagga Camera Container */}
                        <div id="interactive" className="viewport relative"></div>
                        
                        <div className="p-5 text-center space-y-3 bg-white z-20">
                            <div>
                                <p className="text-emerald-600 font-black text-lg">สแกนบาร์โค้ด</p>
                                <p className="text-xs text-gray-500 font-bold">เล็งกล้องให้เห็นบาร์โค้ด (QuaggaJS)</p>
                            </div>
                            
                            <div className="pt-3 border-t border-gray-100">
                                <input 
                                    type="file" 
                                    accept="image/*" 
                                    capture="environment" 
                                    ref={fileInputRef} 
                                    onChange={handleNativeScan} 
                                    className="hidden" 
                                />
                                <button 
                                    onClick={() => fileInputRef.current.click()} 
                                    className="w-full py-3 bg-indigo-50 text-indigo-600 rounded-xl font-bold text-sm hover:bg-indigo-100 transition flex justify-center items-center gap-2 border border-indigo-200"
                                >
                                    <IconCamera /> 📸 ถ่ายรูปให้ AI อ่านแทน
                                </button>
                                <p className="text-[10px] text-red-500 mt-2 font-bold leading-tight">
                                    💡 หากกล้องมืดหรือไม่โฟกัส กดปุ่มนี้เพื่อถ่ายรูปแทนครับ
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [currentScreen, setCurrentScreen] = useState('home');
            const [products, setProducts] = useState([]);
            const [formData, setFormData] = useState({
                barcode: '', name: '', price: '', stock: 1, unit: 'ชิ้น', group: '', brand: ''
            });
            const [isCameraOpen, setIsCameraOpen] = useState(false);
            const [editId, setEditId] = useState(null);
            const [notification, setNotification] = useState({ message: '', type: '' });
            const [searchTerm, setSearchTerm] = useState('');
            const [searchGroup, setSearchGroup] = useState('ทั้งหมด');
            const [imagePreview, setImagePreview] = useState(null);
            const [duplicateItem, setDuplicateItem] = useState(null);

            // Settings & Config
            const [showSettings, setShowSettings] = useState(false);
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
            const [sheetUrl, setSheetUrl] = useState(() => {
                if (CUSTOMER_CONFIG.locked && CUSTOMER_CONFIG.sheetUrl) return CUSTOMER_CONFIG.sheetUrl;
                return localStorage.getItem('google_sheet_url') || CUSTOMER_CONFIG.sheetUrl || '';
            });
            
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const [saveStatus, setSaveStatus] = useState(''); 

            const [showClearModal, setShowClearModal] = useState(false);
            const [securityCode, setSecurityCode] = useState('');
            const [confirmCode, setConfirmCode] = useState('');

            const nameInputRef = useRef(null);
            const fileInputRef = useRef(null);     

            useEffect(() => {
                const saved = localStorage.getItem('sabuy_stock_data_pro');
                if (saved) setProducts(JSON.parse(saved));
            }, []);

            useEffect(() => {
                localStorage.setItem('sabuy_stock_data_pro', JSON.stringify(products));
            }, [products]);

            const getNextId = (currentProducts) => {
                if (!currentProducts || currentProducts.length === 0) return 1;
                const ids = currentProducts.map(p => parseInt(p.id)).filter(n => !isNaN(n));
                return (ids.length > 0 ? Math.max(...ids) : 0) + 1;
            };

            const stats = useMemo(() => {
                return { totalItems: products.length };
            }, [products]);

            const availableGroups = useMemo(() => {
                const groups = new Set(products.map(p => p.group).filter(Boolean));
                return ['ทั้งหมด', ...Array.from(groups)];
            }, [products]);

            const showNotify = (msg, type = 'success') => {
                setNotification({ message: msg, type: type });
                setTimeout(() => setNotification({ message: '', type: '' }), 4000);
            };

            // ==========================================
            // ☁️ Cloud Sync (บันทึกลง Google Sheet)
            // ==========================================
            const saveToCloud = async (dataToSave) => {
                const url = sheetUrl.trim();
                if (!url) return; 
                
                const sortedData = [...dataToSave].sort((a, b) => parseInt(a.id) - parseInt(b.id));

                setSaveStatus('saving');
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'save', data: sortedData })
                    });
                    if (response.ok) {
                        setSaveStatus('saved');
                        setTimeout(() => setSaveStatus(''), 3000);
                    } else throw new Error("Save Failed");
                } catch (e) {
                    setSaveStatus('error');
                }
            };

            // สแกนสำเร็จจาก Quagga
            const handleScanSuccess = (decodedText) => {
                setIsCameraOpen(false); // ปิดหน้ากล้อง
                
                // นำเลขมาใส่ในช่อง
                setFormData(prev => ({ ...prev, barcode: decodedText }));
                showNotify(`✅ สแกนได้เลข: ${decodedText}`);
                
                // ตรวจสอบข้อมูลซ้ำ
                const existing = products.find(p => p.barcode === decodedText);
                if (existing) {
                    setDuplicateItem(existing);
                } else {
                    if (nameInputRef.current) nameInputRef.current.focus();
                }
            };

            // AI OCR ดึงเฉพาะตัวเลขบาร์โค้ด (ทำงานเมื่อกดปุ่ม Fallback)
            const handleExtractBarcodeWithAI = async (base64Image) => {
                setIsCameraOpen(false); // ปิดหน้ากล้อง
                if (!apiKey.trim()) {
                    showNotify('❌ กรุณาใส่ API Key ในตั้งค่าเพื่อใช้ AI ช่วยอ่าน', 'error');
                    setShowSettings(true);
                    return;
                }
                
                setIsAiLoading(true);
                showNotify("ระบบกำลังให้ AI ช่วยแกะตัวเลขบาร์โค้ด...");
                
                const promptText = `คุณคือเครื่องอ่านบาร์โค้ด. ดึงเฉพาะตัวเลขหรือตัวอักษรของ "รหัสบาร์โค้ด" ที่ชัดเจนที่สุดในรูปภาพนี้ ตอบกลับเป็น JSON เท่านั้น รูปแบบ: {"barcode": "ตัวเลขที่อ่านได้"} หากไม่พบตัวเลขบาร์โค้ดเลยให้ตอบ {"barcode": ""}`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: promptText }, { inlineData: { mimeType: "image/jpeg", data: base64Image.split(',')[1] } }] }] })
                    });
                    const data = await response.json();
                    const aiText = data.candidates[0].content.parts[0].text;
                    const result = JSON.parse(aiText.match(/\{[\s\S]*\}/)[0]);
                    
                    if (result && result.barcode) {
                        setFormData(prev => ({ ...prev, barcode: result.barcode }));
                        showNotify(`✨ AI อ่านบาร์โค้ดสำเร็จ: ${result.barcode}`);
                        
                        const existing = products.find(p => p.barcode === result.barcode);
                        if (existing) setDuplicateItem(existing);
                        else if (nameInputRef.current) nameInputRef.current.focus();
                    } else {
                        showNotify("❌ AI มองไม่เห็นบาร์โค้ด ลองถ่ายให้ชัดขึ้นครับ", "error");
                    }
                } catch (e) {
                    showNotify("เกิดข้อผิดพลาดในการดึงข้อมูลด้วย AI", "error");
                } finally {
                    setIsAiLoading(false);
                }
            };

            // AI อเนกประสงค์สำหรับวิเคราะห์รูปภาพสินค้า (ปุ่มรูปดาวหน้าแรก)
            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    setImagePreview(reader.result);
                    callGeminiGeneral(reader.result); 
                };
                reader.readAsDataURL(file);
                e.target.value = "";
            };

            const callGeminiGeneral = async (imageData) => {
                if (!apiKey.trim()) {
                    showNotify('กรุณาใส่ API Key ในการตั้งค่า', 'error');
                    setShowSettings(true);
                    return;
                }
                setIsAiLoading(true);
                
                const promptText = `วิเคราะห์รูปสินค้า ตอบเป็น JSON เท่านั้น: {"barcode": "ตัวเลขบาร์โค้ด (ถ้ามี ปล่อยว่างถ้าไม่มี)", "name": "ชื่อสินค้าภาษาไทย", "group": "กลุ่มสินค้า", "brand": "ยี่ห้อ", "price": ราคาประเมินเป็นตัวเลข, "unit": "หน่วยนับ"}`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: promptText }, { inlineData: { mimeType: "image/jpeg", data: imageData.split(',')[1] } }] }] })
                    });
                    const data = await response.json();
                    const aiText = data.candidates[0].content.parts[0].text;
                    const result = JSON.parse(aiText.match(/\{[\s\S]*\}/)[0]);
                    
                    setFormData(prev => {
                        const newData = { ...prev, ...result };
                        if (!result.barcode) newData.barcode = prev.barcode;
                        return newData;
                    });
                    showNotify("AI วิเคราะห์ข้อมูลเรียบร้อย!");
                } catch (e) {
                    showNotify("AI Error", "error");
                } finally {
                    setIsAiLoading(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                
                if (!formData.name) {
                    showNotify('กรุณาระบุชื่อสินค้า', 'error');
                    if (nameInputRef.current) nameInputRef.current.focus();
                    return;
                }

                const isNameDuplicate = products.some(p => p.name.trim().toLowerCase() === formData.name.trim().toLowerCase() && p.id !== editId);
                if (isNameDuplicate) { showNotify('ชื่อสินค้านี้มีอยู่ในระบบแล้ว', 'error'); return; }

                if (formData.barcode) {
                    const isBarcodeDuplicate = products.some(p => p.barcode === formData.barcode && p.id !== editId);
                    if (isBarcodeDuplicate) { showNotify('บาร์โค้ดนี้ซ้ำกับสินค้าอื่น!', 'error'); return; }
                }

                const timestamp = new Date().toLocaleString('th-TH');
                const newId = editId ? editId : getNextId(products);

                const newProduct = {
                    id: newId,
                    ...formData,
                    price: parseFloat(formData.price) || 0,
                    stock: parseFloat(formData.stock) || 0,
                    createTime: editId ? (products.find(p=>p.id===editId)?.createTime || timestamp) : timestamp,
                    updateTime: timestamp
                };

                let updatedProducts = editId ? products.map(p => p.id === editId ? newProduct : p) : [newProduct, ...products];
                setProducts(updatedProducts);
                setFormData({ barcode: '', name: '', price: '', stock: 1, unit: 'ชิ้น', group: 'ทั่วไป', brand: '' });
                setImagePreview(null);
                setEditId(null);
                showNotify(`บันทึกสำเร็จ (ID: ${newId})`);
                saveToCloud(updatedProducts); 
            };

            const importFromSheet = async () => {
                let url = sheetUrl.trim();
                if (!url) return showNotify("กรุณาใส่ Google Script URL", "error");

                setIsSyncing(true);
                try {
                    const fetchUrl = `${url}${url.includes('?') ? '&' : '?'}action=get&_t=${Date.now()}`;
                    const response = await fetch(fetchUrl);
                    if (!response.ok) throw new Error("Network not ok");
                    const text = await response.text();
                    const data = JSON.parse(text);
                    if (data && Array.isArray(data)) {
                        setProducts(data);
                        showNotify(`⬇️ โหลดข้อมูลสำเร็จ! (${data.length} รายการ)`);
                    }
                } catch (e) {
                    showNotify(`ดึงข้อมูลล้มเหลว`, "error");
                } finally {
                    setIsSyncing(false);
                }
            };

            const testConnection = async () => {
                let url = sheetUrl.trim();
                if (url.includes('/edit')) {
                    alert("URL ผิด: ห้ามใช้ลิงก์ /edit\nต้องใช้ลิงก์ Web App (/exec) จากการกด Deploy");
                    return;
                }
                setIsSyncing(true);
                try {
                    const fetchUrl = `${url}${url.includes('?') ? '&' : '?'}action=ping&_t=${Date.now()}`;
                    const response = await fetch(fetchUrl);
                    if (response.ok) {
                         showNotify("✅ เชื่อมต่อสำเร็จ! (Connected)");
                         localStorage.setItem('google_sheet_url', url);
                         return;
                    }
                    throw new Error("Response not ok");
                } catch (e) {
                    showNotify("❌ เชื่อมต่อไม่ได้ (ตรวจสอบสิทธิ์ Anyone)", "error");
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                if ((name === 'price' || name === 'stock') && parseFloat(value) < 0) return;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const updateQuickStock = (id, newStockVal) => {
                const updatedProducts = products.map(p => 
                    p.id === id ? { ...p, stock: Math.max(0, parseFloat(newStockVal)), updateTime: new Date().toLocaleString('th-TH') } : p
                );
                setProducts(updatedProducts);
                saveToCloud(updatedProducts); 
            };

            const adjustQuickStock = (id, delta) => {
                const product = products.find(p => p.id === id);
                if (!product) return;
                updateQuickStock(id, Math.max(0, parseFloat(product.stock || 0) + delta));
            };

            // --- Clear Data Logic ---
            const generateSecurityCode = () => {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                let result = '';
                for (let i = 0; i < 5; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
                return result;
            };

            const initiateClearData = () => {
                if (products.length === 0) return showNotify("ไม่มีข้อมูลให้ลบ", "error");
                setSecurityCode(generateSecurityCode());
                setConfirmCode('');
                setShowClearModal(true);
            };

            const executeClearData = () => {
                if (confirmCode !== securityCode) return showNotify("รหัสไม่ถูกต้อง!", "error");
                if (confirm("ยืนยันการลบข้อมูลทั้งหมดหรือไม่?")) {
                    setProducts([]);
                    localStorage.setItem('sabuy_stock_data_pro', JSON.stringify([]));
                    saveToCloud([]); 
                    setShowClearModal(false);
                    setShowSettings(false);
                    showNotify("ล้างข้อมูลเรียบร้อยแล้ว");
                }
            };

            const exportBackup = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(products));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", `sabuy_stock_backup_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            };

            const importBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const fileName = file.name.toLowerCase();
                const reader = new FileReader();

                if (fileName.endsWith('.json')) {
                    reader.onload = (evt) => {
                        try {
                            const imported = JSON.parse(evt.target.result);
                            if (Array.isArray(imported)) {
                                setProducts(imported);
                                showNotify("นำเข้า JSON สำเร็จ!");
                                saveToCloud(imported);
                            }
                        } catch (e) { showNotify("ไฟล์ JSON ไม่ถูกต้อง", "error"); }
                    };
                    reader.readAsText(file);
                } else if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
                    reader.onload = (evt) => {
                        try {
                            const data = new Uint8Array(evt.target.result);
                            const workbook = XLSX.read(data, { type: 'array' });
                            const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                            if (json.length === 0) return showNotify("ไม่พบข้อมูล", "error"); 

                            const mappedProducts = json.map((row, idx) => ({
                                id: parseInt(row['ID']) || (Date.now() + idx),
                                barcode: String(row['Barcode หลัก'] || row['บาร์โค้ด'] || ''),
                                name: String(row['ชื่อสินค้า'] || ''),
                                price: parseFloat(row['ราคาขาย 1'] || row['ราคา'] || 0),
                                stock: parseFloat(row['Stock'] || row['คงเหลือ'] || 0),
                                unit: String(row['หน่วยเล็กที่สุด'] || row['หน่วย'] || 'ชิ้น'),
                                group: String(row['กลุ่มสินค้า'] || row['กลุ่ม'] || 'ทั่วไป'),
                                brand: String(row['Brand (ยี่ห้อสินค้า)'] || row['Brand'] || ''),
                                createTime: row['Create Time'] || new Date().toLocaleString('th-TH'),
                                updateTime: row['Update Time'] || new Date().toLocaleString('th-TH')
                            })).filter(p => p.barcode && p.name);

                            if (mappedProducts.length > 0 && confirm(`นำเข้า ${mappedProducts.length} รายการ?`)) {
                                setProducts(mappedProducts);
                                showNotify("นำเข้า Excel สำเร็จ!");
                                saveToCloud(mappedProducts);
                            }
                        } catch (e) { showNotify("Error Reading Excel", "error"); }
                    };
                    reader.readAsArrayBuffer(file);
                }
                e.target.value = "";
            };

            const filteredProducts = products.filter(p => {
                const matchesSearch = p.barcode.includes(searchTerm) || p.name.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesGroup = searchGroup === 'ทั้งหมด' || p.group === searchGroup;
                return matchesSearch && matchesGroup;
            });

            return (
                <div className="max-w-md mx-auto min-h-screen pb-20 shadow-xl bg-white relative">
                    {notification.message && (
                        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[60] px-4 py-2 rounded-full shadow-2xl text-white font-bold text-sm flex items-center gap-2 animate-bounce ${notification.type === 'error' ? 'bg-red-500' : 'bg-green-600'}`}>
                            {notification.message}
                        </div>
                    )}

                    {/* Navbar */}
                    <header className="bg-emerald-700 text-white p-4 sticky top-0 z-40 flex justify-between items-center rounded-b-2xl shadow-lg">
                        <div className="flex items-center gap-2">
                            <IconPackage />
                            <h1 className="text-xl font-bold tracking-tight">{CUSTOMER_CONFIG.shopName || "Sabuy Stock"}</h1>
                        </div>
                        <div className="flex gap-2 items-center">
                            <div className="mr-1 relative">
                                {saveStatus === 'saving' && <IconCloud className="text-white animate-spin-slow opacity-80" />}
                                {saveStatus === 'saved' && <IconCheckCircle className="text-green-300 scale-125 transition-transform" />}
                                {saveStatus === 'error' && <IconAlertCircle className="text-red-300 animate-pulse" />}
                                {saveStatus === '' && <IconCloud className={`transition-colors duration-300 ${sheetUrl ? 'text-green-300 opacity-80' : 'text-gray-400 opacity-50'}`} />}
                            </div>
                            <button onClick={() => setCurrentScreen('home')} className={`p-2 rounded-xl transition ${currentScreen === 'home' ? 'bg-white text-emerald-700' : 'hover:bg-white/10'}`}><IconPlus /></button>
                            <button onClick={() => setCurrentScreen('view')} className={`p-2 rounded-xl transition ${currentScreen === 'view' ? 'bg-white text-emerald-700' : 'hover:bg-white/10'}`}><IconList /></button>
                            <button onClick={() => setShowSettings(true)} className="p-2 hover:bg-white/10 rounded-xl transition"><IconSettings /></button>
                        </div>
                    </header>

                    <main className="p-4 space-y-6">
                        <section className="bg-emerald-50 p-4 rounded-3xl border border-emerald-100 shadow-sm flex items-center justify-between px-6">
                             <div className="flex items-center gap-3">
                                <div className="p-3 bg-emerald-100 text-emerald-600 rounded-full"><IconPackage /></div>
                                <div>
                                    <div className="text-xs text-emerald-600 font-bold uppercase tracking-wider">สินค้าในระบบ</div>
                                    <div className="text-2xl font-black text-emerald-800">{stats.totalItems} รายการ</div>
                                </div>
                             </div>
                        </section>

                        {currentScreen === 'home' ? (
                            <>
                            <section className="bg-white rounded-3xl p-1 border-gray-100 space-y-4">
                                <h2 className="text-lg font-bold text-gray-800 px-2 flex items-center justify-between">
                                    {editId ? '📝 แก้ไขสินค้า' : '📦 เพิ่มสินค้าใหม่'}
                                    {isAiLoading && <span className="text-xs text-emerald-600 animate-pulse">AI กำลังทำงาน...</span>}
                                </h2>

                                <form onSubmit={handleSubmit} className="space-y-3">
                                    <div className="flex gap-2">
                                        <div className="flex-1">
                                            <label className="text-xs font-bold text-gray-500 ml-1">บาร์โค้ด <span className="text-gray-400 font-normal">(ถ้ามี)</span></label>
                                            <input type="text" name="barcode" value={formData.barcode} onChange={handleChange} className="w-full p-3 bg-gray-50 rounded-2xl border focus:border-emerald-500 outline-none transition" placeholder="เลขบาร์โค้ด (ว่างได้)" />
                                        </div>
                                        <button type="button" onClick={() => setIsCameraOpen(true)} className="mt-5 p-3 bg-emerald-600 text-white rounded-2xl hover:bg-emerald-700 shadow-lg shadow-emerald-100 transition"><IconCamera /></button>
                                    </div>

                                    {imagePreview && (
                                        <div className="relative w-24 h-24 mx-auto border rounded-2xl overflow-hidden group">
                                            <img src={imagePreview} className="w-full h-full object-cover" alt="Preview" />
                                            <button onClick={() => setImagePreview(null)} className="absolute top-1 right-1 bg-white/80 p-1 rounded-full text-red-500 opacity-0 group-hover:opacity-100 transition"><IconClose /></button>
                                        </div>
                                    )}

                                    <div className="flex gap-2">
                                        <input type="file" ref={fileInputRef} accept="image/*" capture="environment" className="hidden" onChange={handleImageUpload} />
                                        <button type="button" onClick={() => fileInputRef.current.click()} className="flex-1 py-3 bg-emerald-50 text-emerald-700 border-2 border-emerald-200 rounded-xl text-xs font-black flex items-center justify-center gap-2 hover:bg-emerald-100 transition shadow-sm"><IconSparkles /> AI ถ่ายรูปหาสินค้าอัตโนมัติ</button>
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-gray-500 ml-1">ชื่อสินค้า <span className="text-red-500">*</span></label>
                                        <input ref={nameInputRef} type="text" name="name" value={formData.name} onChange={handleChange} className={`w-full p-3 bg-gray-50 rounded-2xl border focus:border-emerald-500 outline-none transition ${isAiLoading ? 'ai-glow' : ''}`} placeholder="ระบุชื่อสินค้า..." />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs font-bold text-gray-500 ml-1">กลุ่มสินค้า</label>
                                            <input list="groups" name="group" value={formData.group} onChange={handleChange} className="w-full p-3 bg-gray-50 rounded-2xl border outline-none" placeholder="ระบุกลุ่มสินค้า" />
                                            <datalist id="groups">
                                                {availableGroups.filter(g => g!=='ทั้งหมด').map(g => <option key={g} value={g} />)}
                                            </datalist>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-gray-500 ml-1">ยี่ห้อ (Brand)</label>
                                            <input type="text" name="brand" value={formData.brand} onChange={handleChange} className="w-full p-3 bg-gray-50 rounded-2xl border outline-none" placeholder="ระบุยี่ห้อ..." />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs font-bold text-gray-500 ml-1">ราคาขาย</label>
                                            <input type="number" step="any" name="price" value={formData.price} onChange={handleChange} className="w-full p-3 bg-gray-50 rounded-2xl border outline-none" placeholder="0.00" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-gray-500 ml-1">หน่วย</label>
                                            <input type="text" name="unit" value={formData.unit} onChange={handleChange} className="w-full p-3 bg-gray-50 rounded-2xl border outline-none" placeholder="ชิ้น" />
                                        </div>
                                    </div>

                                    <div className="flex items-center justify-between bg-gray-50 p-3 rounded-2xl border border-dashed border-gray-300">
                                        <div className="flex items-center gap-4 w-full justify-center">
                                            <button type="button" onClick={() => setFormData(p => ({...p, stock: Math.max(0, parseFloat(p.stock || 0)-1)}))} className="p-2 bg-white rounded-xl shadow border text-red-500"><IconMinus /></button>
                                            <div className="text-center">
                                                <input 
                                                    type="number" 
                                                    step="any"
                                                    name="stock"
                                                    value={formData.stock} 
                                                    onChange={handleChange}
                                                    className="text-xl font-black text-gray-700 w-20 text-center bg-transparent outline-none"
                                                />
                                                <div className="text-[10px] text-gray-400 font-bold uppercase">จำนวนสต็อก</div>
                                            </div>
                                            <button type="button" onClick={() => setFormData(p => ({...p, stock: parseFloat(p.stock || 0)+1}))} className="p-2 bg-white rounded-xl shadow border text-green-600"><IconPlus /></button>
                                        </div>
                                    </div>

                                    <button type="submit" className="w-full py-4 bg-emerald-600 text-white rounded-2xl font-black shadow-xl shadow-emerald-100 flex items-center justify-center gap-2 hover:bg-emerald-700 transition transform active:scale-95">
                                        <IconSave /> {editId ? 'ยืนยันการแก้ไข' : 'บันทึกเข้าสต็อก'}
                                    </button>
                                </form>
                            </section>

                            <section className="mt-6 pt-6 border-t border-dashed border-gray-200">
                                <h3 className="text-sm font-bold text-gray-500 mb-3 ml-2 uppercase">รายการล่าสุด</h3>
                                <div className="space-y-2">
                                    {products.slice(0, 5).map(p => (
                                        <div key={p.id} className="bg-white p-3 rounded-xl border border-gray-100 flex justify-between items-center shadow-sm">
                                            <div>
                                                <div className="font-bold text-gray-800 text-sm line-clamp-1">{p.name}</div>
                                                <div className="flex gap-2 text-[10px] text-gray-400 mt-1">
                                                    <span>{p.barcode}</span>
                                                    {p.brand && <span className="bg-gray-100 px-1 rounded text-gray-500">{p.brand}</span>}
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <div className="text-right">
                                                    <div className="font-bold text-emerald-600 text-sm">฿{parseFloat(p.price).toLocaleString()}</div>
                                                    <div className="text-[10px] text-gray-400">คงเหลือ: {p.stock}</div>
                                                </div>
                                                <button onClick={() => { setEditId(p.id); setFormData(p); window.scrollTo({top:0, behavior:'smooth'}); }} className="text-gray-400 hover:text-emerald-600"><IconEdit /></button>
                                            </div>
                                        </div>
                                    ))}
                                    {products.length === 0 && <div className="text-center text-gray-300 text-sm py-4">ยังไม่มีข้อมูลสินค้า</div>}
                                </div>
                            </section>
                            </>
                        ) : (
                            <section className="space-y-4">
                                <div className="sticky top-[72px] bg-white pt-2 pb-4 z-30">
                                    <div className="relative">
                                        <span className="absolute left-4 top-3.5 text-gray-400"><IconSearch /></span>
                                        <input type="text" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="ค้นหาชื่อ, บาร์โค้ด..." className="w-full pl-12 pr-4 py-3 bg-gray-100 rounded-2xl border-transparent focus:bg-white focus:border-emerald-500 transition outline-none" />
                                    </div>
                                    <div className="flex gap-2 overflow-x-auto mt-3 py-1 no-scrollbar">
                                        {availableGroups.map(g => (
                                            <button key={g} onClick={() => setSearchGroup(g)} className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition border ${searchGroup === g ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-gray-500 border-gray-200 hover:border-emerald-300'}`}>
                                                {g}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    {filteredProducts.map((p, index) => (
                                        <div key={p.id} className="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm hover:shadow-md transition">
                                            <div className="flex justify-between items-start mb-2">
                                                <div className="flex gap-3">
                                                    <div className="flex items-center justify-center w-8 h-8 rounded-full bg-emerald-100 text-emerald-700 font-bold text-xs">
                                                        {p.id}
                                                    </div>
                                                    <div>
                                                        <h3 className="font-black text-gray-800 leading-tight">{p.name}</h3>
                                                        <div className="flex items-center gap-2 mt-1 flex-wrap">
                                                            <span className="text-[10px] font-mono text-gray-400 bg-gray-50 px-1 rounded">{p.barcode}</span>
                                                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full border bg-gray-100 text-gray-600">{p.group}</span>
                                                            {p.brand && <span className="text-[10px] flex items-center gap-1 text-emerald-600"><IconTag /> {p.brand}</span>}
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => { setEditId(p.id); setFormData(p); setCurrentScreen('home'); }} className="p-2 text-emerald-500 bg-emerald-50 rounded-xl hover:bg-emerald-100 transition"><IconEdit /></button>
                                                    <button onClick={() => { if(confirm('ลบรายการนี้?')) setProducts(ps => ps.filter(x => x.id !== p.id)) }} className="p-2 text-red-500 bg-red-50 rounded-xl hover:bg-red-100 transition"><IconTrash2 /></button>
                                                </div>
                                            </div>
                                            <div className="flex items-center justify-between mt-4 pl-11">
                                                <div className="text-emerald-700 font-black">฿{parseFloat(p.price).toLocaleString()} <span className="text-[10px] text-gray-400">/{p.unit}</span></div>
                                                <div className="flex items-center gap-2 bg-gray-50 p-1 rounded-2xl border border-gray-100">
                                                    <button onClick={() => adjustQuickStock(p.id, -1)} className="w-8 h-8 flex items-center justify-center bg-white rounded-xl shadow-sm text-red-500"><IconMinus /></button>
                                                    <input 
                                                        type="number"
                                                        step="any"
                                                        value={p.stock}
                                                        onChange={(e) => updateQuickStock(p.id, e.target.value)}
                                                        className="w-16 text-center font-black text-gray-800 bg-transparent outline-none"
                                                    />
                                                    <button onClick={() => adjustQuickStock(p.id, 1)} className="w-8 h-8 flex items-center justify-center bg-white rounded-xl shadow-sm text-green-600"><IconPlus /></button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    {filteredProducts.length === 0 && <div className="text-center py-20 text-gray-400 font-bold">ไม่พบข้อมูลสินค้า</div>}
                                </div>
                            </section>
                        )}
                    </main>

                    {/* Bottom Floating Bar */}
                    {currentScreen === 'view' && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-full max-w-xs px-4 flex gap-2">
                            <button onClick={() => {
                                setEditId(null);
                                setFormData({ barcode: '', name: '', price: '', stock: 1, unit: 'ชิ้น', group: '', brand: '' });
                                setCurrentScreen('home');
                                window.scrollTo({top:0, behavior:'smooth'});
                            }} className="flex-1 py-3 bg-emerald-600 text-white rounded-2xl shadow-xl shadow-emerald-100 font-bold flex items-center justify-center gap-2 hover:bg-emerald-700 transition">
                                <IconPlus /> Add
                            </button>
                        </div>
                    )}

                    {/* Duplicate Modal */}
                    {duplicateItem && (
                        <div className="fixed inset-0 bg-black/60 z-[70] flex items-center justify-center p-6 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-sm rounded-[32px] p-8 shadow-2xl space-y-6 text-center">
                                <div className="w-20 h-20 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center mx-auto">
                                    <IconAlertCircle />
                                </div>
                                <div>
                                    <h3 className="text-xl font-black text-gray-800">พบสินค้าซ้ำ!</h3>
                                    <p className="text-gray-500 text-sm mt-1 font-bold">"{duplicateItem.name}"</p>
                                    <p className="text-gray-400 text-xs mt-1">มีอยู่ในระบบแล้ว คุณต้องการทำอะไร?</p>
                                </div>
                                <div className="space-y-3 pt-2">
                                    <button onClick={() => { adjustQuickStock(duplicateItem.id, 1); setDuplicateItem(null); setFormData(p => ({...p, barcode: ''})); }} className="w-full py-4 bg-emerald-600 text-white rounded-2xl font-black shadow-lg shadow-emerald-100 hover:bg-emerald-700">บวกสต็อกเพิ่ม (+1)</button>
                                    <button onClick={() => { setEditId(duplicateItem.id); setFormData(duplicateItem); setDuplicateItem(null); setCurrentScreen('home'); }} className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black shadow-lg shadow-indigo-100 hover:bg-indigo-700">แก้ไขข้อมูลรายการเดิม</button>
                                    <button onClick={() => { setDuplicateItem(null); setFormData(p => ({...p, barcode: ''})); }} className="w-full py-4 bg-gray-100 text-gray-500 rounded-2xl font-black hover:bg-gray-200">ยกเลิก</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Clear Data Confirmation Modal */}
                    {showClearModal && (
                        <div className="fixed inset-0 bg-black/70 z-[80] flex items-center justify-center p-6 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-sm rounded-[32px] p-8 shadow-2xl space-y-6 text-center border-4 border-red-100 animate-bounce-short">
                                <div className="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <IconShieldAlert />
                                </div>
                                <div>
                                    <h3 className="text-xl font-black text-gray-900">ยืนยันการลบข้อมูล?</h3>
                                    <p className="text-gray-500 text-sm mt-2">กรุณากรอกรหัสความปลอดภัยด้านล่าง</p>
                                    
                                    <div className="my-6 bg-gray-100 p-4 rounded-xl">
                                        <p className="text-xs text-gray-400 mb-1 font-bold uppercase tracking-widest">รหัสความปลอดภัย</p>
                                        <p className="text-3xl font-mono font-black text-indigo-600 tracking-widest select-all cursor-pointer" onClick={() => {navigator.clipboard.writeText(securityCode); showNotify("คัดลอกรหัสแล้ว")}}>
                                            {securityCode}
                                        </p>
                                    </div>

                                    <input 
                                        type="text" 
                                        value={confirmCode}
                                        onChange={(e) => setConfirmCode(e.target.value)}
                                        placeholder="กรอกรหัสที่นี่..."
                                        className="w-full p-3 bg-white border-2 border-gray-200 rounded-2xl text-center font-bold text-lg focus:border-red-500 outline-none transition"
                                    />
                                </div>
                                <div className="space-y-3 pt-2">
                                    <button onClick={executeClearData} className="w-full py-4 bg-red-600 text-white rounded-2xl font-black shadow-lg shadow-red-200 hover:bg-red-700 transition">ยืนยันการลบทั้งหมด</button>
                                    <button onClick={() => setShowClearModal(false)} className="w-full py-4 bg-gray-100 text-gray-600 rounded-2xl font-bold hover:bg-gray-200 transition">ยกเลิก</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Quagga Scanner Modal */}
                    {isCameraOpen && (
                        <QuaggaScanner 
                            onScan={handleScanSuccess} 
                            onClose={() => setIsCameraOpen(false)} 
                            onAiFallback={handleExtractBarcodeWithAI}
                        />
                    )}

                    {/* Settings Modal */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-6 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-sm rounded-[32px] p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="text-xl font-black flex items-center gap-2"><IconSettings /> ตั้งค่า</h3>
                                    <button onClick={() => setShowSettings(false)} className="p-2 hover:bg-gray-100 rounded-full"><IconClose /></button>
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-gray-500 ml-1">Gemini API Key</label>
                                        <input type="password" value={apiKey} onChange={e => {setApiKey(e.target.value); localStorage.setItem('gemini_api_key', e.target.value);}} className="w-full p-3 bg-gray-50 rounded-2xl border outline-none text-sm" placeholder="Paste API Key..." />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-500 ml-1">Google Sheet App URL</label>
                                        <div className="flex gap-2">
                                            <input 
                                                type="text" 
                                                value={sheetUrl} 
                                                onChange={e => {setSheetUrl(e.target.value); localStorage.setItem('google_sheet_url', e.target.value);}}
                                                disabled={CUSTOMER_CONFIG.locked}
                                                className={`flex-1 p-3 rounded-2xl border outline-none text-sm ${CUSTOMER_CONFIG.locked ? 'bg-gray-100 text-gray-500 cursor-not-allowed' : 'bg-gray-50'}`}
                                                placeholder="https://script.google.com/..." 
                                            />
                                            <button onClick={testConnection} disabled={isSyncing} className="px-4 bg-emerald-100 text-emerald-700 rounded-2xl text-xs font-bold hover:bg-emerald-200 transition">
                                                {isSyncing ? '...' : <IconCheckCircle />}
                                            </button>
                                        </div>
                                        <p className="text-[10px] text-gray-400 mt-1">วาง URL ของ Google Apps Script Web App</p>
                                    </div>
                                    
                                    <div className="pt-2 border-t space-y-3">
                                        <p className="text-xs font-bold text-gray-400 uppercase tracking-widest">Google Cloud Sync</p>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button onClick={() => importFromSheet()} disabled={isSyncing} className="col-span-2 py-3 bg-orange-500 text-white rounded-2xl text-xs font-bold hover:bg-orange-600 transition flex flex-col items-center justify-center gap-1">
                                                <IconCloudDownload /> ดึงข้อมูลจาก Cloud มาทับ
                                            </button>
                                            <button onClick={() => { exportToExcel(); setShowSettings(false); showNotify("ส่งออกไฟล์ Excel สำเร็จ"); }} className="col-span-2 py-3 bg-blue-500 text-white rounded-2xl text-xs font-bold hover:bg-blue-600 transition flex items-center justify-center gap-2 shadow-sm">
                                                <IconFileSpreadsheet /> ส่งออกเป็นไฟล์ Excel
                                            </button>
                                        </div>
                                    </div>

                                    <div className="pt-2 border-t">
                                        <p className="text-xs font-bold text-gray-400 mb-2 uppercase tracking-widest">สำรองไฟล์ (ในเครื่อง)</p>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button onClick={exportBackup} className="py-3 bg-gray-800 text-white rounded-2xl text-xs font-bold hover:bg-black transition">ส่งออก JSON</button>
                                            <label className="py-3 bg-gray-100 text-gray-700 border border-gray-200 rounded-2xl text-xs font-bold text-center cursor-pointer hover:bg-gray-200 transition flex items-center justify-center">
                                                นำเข้า JSON/Excel
                                                <input type="file" accept=".json, .xlsx, .xls" onChange={importBackup} className="hidden" />
                                            </label>
                                        </div>
                                    </div>

                                    {/* Clear Data Button */}
                                    <div className="pt-4 mt-2 border-t">
                                        <button onClick={initiateClearData} className="w-full py-3 bg-red-50 text-red-600 border border-red-100 rounded-2xl text-xs font-bold hover:bg-red-100 transition flex items-center justify-center gap-2">
                                            <IconTrash2 /> ล้างข้อมูลทั้งหมด (Clear Data)
                                        </button>
                                    </div>
                                </div>
                                <button onClick={() => setShowSettings(false)} className="w-full py-4 bg-emerald-700 text-white rounded-2xl font-black mt-4">ปิดหน้าต่าง</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- Export Excel Helper ---
        function exportToExcel() {
            const products = JSON.parse(localStorage.getItem('sabuy_stock_data_pro') || '[]');
            if (products.length === 0) return;
            
            const data = products.map((p, i) => ({
                'ID': p.id,
                'รหัสสินค้า': '',
                'Barcode หลัก': p.barcode,
                'ชื่อสินค้า': p.name,
                'Stock': parseFloat(p.stock).toFixed(3),
                'ราคาขาย 1': parseFloat(p.price || 0).toFixed(3),
                'ราคาขาย 2': '0.000',
                'ราคาขาย 3': '0.000',
                'ราคาขาย 4': '0.000',
                'ราคาขาย 5': '0.000',
                'ราคาขายต่ำสุด': '0.000',
                'ต้นทุนมาตรฐาน': '0.000',
                'หน่วยเล็กที่สุด': p.unit,
                'ชื่อสินค้า 2': '',
                'จำนวนที่ได้ราคาช่อง 2': '0.000',
                'จำนวนที่ได้ราคาช่อง 3': '0.000',
                'จำนวนที่ได้ราคาช่อง 4': '0.000',
                'จำนวนที่ได้ราคาช่อง 5': '0.000',
                'Extra Volume': '',
                'จำนวนสินค้าเป็นทศนิยมได้': 'False',
                'ส่วนลดสมาชิก 1(%)': '0.00',
                'ส่วนลดสมาชิก 2(%)': '0.00',
                'ส่วนลดสมาชิก 3(%)': '0.00',
                'กว้าง': '0.000',
                'ยาว': '0.000',
                'สูง': '0.000',
                'น้ำหนัก': '0.000',
                'น้ำหนักรวมบรรจุภัณฑ์': '0.000',
                'จำนวนที่เตือนใกล้หมด': '',
                'จำนวนที่ต้องการให้มี': '',
                'ประเภทสินค้า': '', 
                'กลุ่มสินค้า': p.group || '', 
                'Brand (ยี่ห้อสินค้า)': p.brand || '',
                'Supplier หลัก': '',
                'VAT': 'True',
                'สะสมแต้มได้': 'True',
                'Point (แต้มที่ได้)': '0.000',
                'Hot Product': 'False',
                'สินค้าสำเร็จรูป': 'False',
                'Location (ที่เก็บสินค้า)': '',
                'Printer ID': '',
                'Comment (หมายเหตุ)': '',
                'แสดงบน Website': 'True',
                'แสดงหน่วยเล็ก Website': 'True',
                'แสดงใหญ่บน Website': 'True',
                'คำอธิบายบน Website': '', 
                'Status': 'True',
                'Create Officer': 'Admin',
                'Create Time': p.createTime || new Date().toLocaleString('th-TH'),
                'Update Officer': 'Admin',
                'Update Time': p.updateTime || new Date().toLocaleString('th-TH')
            }));

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
            XLSX.writeFile(wb, `Product_Lists_Export_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
